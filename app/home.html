<script>

        play_vid("http://192.168.1.13/api/videoserver/mouvideo.mp4", "Test-MP4", "", JSON.stringify({}));

    $("#HLSm3u8").click(function () {
        play_vid("http://192.168.1.13/api/videoserver/video.m3u8", "Test-M3U8", "", JSON.stringify({
            "User-Agent": "mou_user_agent",

</script>
